          format: double
          description: The soft monthly spend limit in euros (> 0).
        thresholds_pct:
          type: array
          items:
            type: integer
          description: >-
            Ascending percentages (each 0 < pct <= 100) of the limit at which a
            one-time usage.alert fires for the month.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SetBudgetRequest:
      type: object
      required: [monthly_limit_eur, thresholds_pct]
      properties:
        monthly_limit_eur:
          type: number
          format: double
          description: Must be > 0.
        thresholds_pct:
          type: array
          items:
            type: integer
          description: >-
            Non-empty, strictly ascending, each 0 < pct <= 100.

