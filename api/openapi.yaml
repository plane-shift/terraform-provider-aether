openapi: 3.1.0
info:
  title: Aether API
  version: 1.0.0
  description: |
    The Aether HTTP API for managing organizations, Kubernetes clusters, node
    pools, container registries, and billing on the Aether platform.

    ## Base URL

    All endpoints are served under `https://api.aetherplatform.cloud`. Versioned
    routes live under the `/api/v1` prefix.

    ## Authentication

    Requests authenticate with an API token of the form `aether_<hex>`, sent in the
    `Authorization` header as a Bearer credential:

    ```
    Authorization: Bearer aether_0123456789abcdef...
    ```

    Tokens are created per organization (see the API Tokens endpoints) and the raw
    secret is shown only once, at creation time. Unauthenticated requests receive
    `401`.

    ## Rate limiting

    Requests are rate-limited to **100 requests per minute per key** (token-bucket
    with a small burst allowance). Exceeding the limit returns `429`.

    ## Pagination

    List endpoints use opaque cursor pagination via query parameters:

    ```
    ?cursor=<UUID>&limit=<N>
    ```

    `limit` defaults to `50` and is capped at `100`. The response envelope carries
    the items plus a `next_cursor` field; when `next_cursor` is absent there are no
    further pages. Pass the returned `next_cursor` value back as `cursor` to fetch
    the next page.

    ## Errors

    Errors are returned as a JSON object with an `error` member containing a stable
    `code`, a human-readable `message`, and (for validation failures) a `details`
    array.

    ## Packages

    A cluster is billed either from a package or per resource ("custom"). The
    choice is made when the cluster is created — the `plan` field on the create
    request — and is fixed for the cluster's lifetime. The catalogue currently
    offers four packages (`dev`, `starter`, `growth`, `scale`), and a retired
    package can still appear on an existing cluster; each is a flat monthly fee
    per cluster covering an allowance of vCPUs, memory and node disk, and
    anything above the allowance is charged per resource, each dimension on its
    own. Omitting `plan` bills the cluster entirely per resource. Either way
    load balancers, persistent volumes, registry storage and the public API
    endpoint — which every cluster is required to have, and which no package
    fee includes — are charged separately. The current package prices and
    allowances are shown in the portal when you create a cluster (and, once
    published, on the pricing page).

servers:
  - url: https://api.aetherplatform.cloud

security:
  - bearerApiToken: []

tags:
  - name: Organizations
    description: >-
      Organization CRUD plus org-scoped members, API tokens, and the audit log.
  - name: Webhooks
    description: |
      Outbound webhook endpoints and their delivery log. Aether POSTs a JSON
      event envelope to every subscribed endpoint:

      ```
      {"id": "<event UUID>", "type": "<event type>",
       "created_at": "<RFC 3339>", "org_id": "<org UUID>", "data": {...}}
      ```

      Each delivery carries the headers `X-Aether-Event` (event type),
      `X-Aether-Event-Id` (event UUID, shared across endpoints receiving the
      same event), `X-Aether-Delivery` (delivery UUID), `X-Aether-Timestamp`
      (unix seconds), and `X-Aether-Signature` with the value
      `v1=<hex(HMAC-SHA256(secret, "<timestamp>.<raw body>"))>` — verify by
      recomputing the HMAC with the stored secret over the timestamp, a `.`,
      and the raw request body, and reject stale timestamps (replay
      resistance).

      A `2xx` response marks the delivery `succeeded`. Anything else (non-2xx,
      timeout, connection error) is retried on a fixed backoff schedule — waits
      of 2m, 10m, 30m, 2h, 6h, 12h, and 24h between 8 total attempts (≈ 2
      days) — after which the delivery is marked `dead`. Redirects are not
      followed. Delivery is **at-least-once**: consumers must deduplicate on
      `X-Aether-Event-Id`.

      Endpoint URLs must be `https`, without embedded credentials, and must not
      point at private, loopback, or otherwise internal address ranges.
  - name: Clusters
    description: >-
      Kubernetes cluster lifecycle, networking, kubeconfig retrieval, upgrades,
      node pools, and load balancers.
  - name: Registry
    description: >-
      Org-level container registry (Harbor project), repositories, tags, robot
      accounts, and cleanup policies.
  - name: Billing
    description: Usage, daily spend, invoices, and payment methods.
  - name: Support
    description: >-
      Support tickets and their message threads. Tickets are org-scoped;
      messages are attributed to their author (`tenant` or `provider`). A
      tenant reply reopens a `waiting`/`resolved` ticket, a provider reply on an
      `open` ticket moves it to `in_progress`, and message creation recomputes
      the ticket's status and lifecycle timestamps in a single transaction.
  - name: Admin
    description: >-
      Platform-scoped (non-org) administration. Every `/api/v1/admin` endpoint
      requires the Keycloak `platform-admin` realm role and is reachable only
      with an interactive OIDC JWT — API tokens carry no roles and are rejected
      with 403.

paths:
  /api/v1/regions:
    get:
      tags: [Clusters]
      operationId: listRegions
      summary: List regions
      description: |
        The regions the platform knows about. `region` on cluster creation
        must name a region with an enabled Proxmox endpoint configured on this
        instance (otherwise `422` `validation_error`); the cluster is recorded
        under the region this API instance serves. `available` is
        informational. **Public — no authentication required**, so the
        pre-login signup wizard can populate its picker. Subject to the global
        rate limit.

        `available` is true only for the region this API instance itself
        serves (its `AETHER_REGION` setting); every other entry is
        informational and is **not** what cluster creation checks.

        Cluster creation accepts only a region this instance can place into:
        `POST /api/v1/organizations/{orgId}/clusters` resolves the requested
        `region` to an enabled Proxmox endpoint and rejects a region with none
        with `422` (`validation_error`, a message naming the region:
        `No Proxmox endpoint is configured for region eu-fi`). The created
        cluster is recorded under the region this instance serves.

        The list is static in the binary today — it is not read from the
        database and does not reflect capacity.
      security: []
      responses:
        '200':
          description: The known regions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    description: >-
                      Never `null`; the list is static in the binary and is
                      not paginated.
                    items:
                      type: object
                      required: [id, name, location, available]
                      properties:
                        id:
                          type: string
                          example: eu-fi
                          description: Region identifier used as `region` on cluster creation.
                        name:
                          type: string
                          example: Europe (Finland)
                        location:
                          type: string
                          example: Helsinki
                        available:
                          type: boolean
                          description: True only for the region this API serves.
              example:
                items:
                  - id: eu-fi
                    name: Europe (Finland)
                    location: Helsinki
                    available: true

  /api/v1/k8s-versions:
    get:
      tags: [Clusters]
      operationId: listK8sVersions
      summary: List offered Kubernetes versions
      description: |
        The Kubernetes versions a cluster can currently be created on or
        upgraded to. **Public — no authentication required**, so the pre-login
        portal wizard can populate its picker. Subject to the global rate limit.

        This endpoint is the authoritative source for that picker: a version
        absent from this list is rejected by cluster creation and by upgrade
        with `422`.

        Each `version` is a **minor** (`"1.37"`), not a full patch version.
        Create and upgrade accept either form — a bare minor resolves to the
        latest patch Aether has verified for it, and a full
        `MAJOR.MINOR.PATCH` is accepted when its minor is offered and the patch
        is one this platform has resolved (at or below the minor's current
        `patch`); otherwise `422`.

        Every entry also carries `patch`: the full version that minor currently
        resolves to (`"1.37.0"`), so a picker can show the concrete version
        alongside the label without a second call.

        The list is every Kubernetes minor upstream still supports that the
        deployed Talos worker image can run, ordered newest-first. Two bounds,
        not three:

        - **Upstream's support window** — the minors whose `endOfLifeDate` in
          the Kubernetes release schedule has not passed. Normally three;
          **four** during the ~2-month overlap after a new minor ships. Do not
          assume a maximum of three entries.
        - **The deployed Talos worker image** (`AETHER_TALOS_VERSION`) caps the
          top. A minor the worker OS cannot run is never offered: the tenant
          control plane would roll to a version no kubelet can match. Every
          patch of an offered minor is runnable by that image, so the cap never
          refuses a patch of a minor this endpoint lists.

        aether-operator accepts the uncapped upstream window, so everything
        offered here is provisionable by construction — both components read
        the same resolver (`github.com/plane-shift/k8s-versions-go`) rather
        than each deriving a window of its own.

        A minor upstream supports but for which no patch release has been
        published yet is not offered (there is nothing to deploy), though the
        operator would accept it.

        When the list is non-empty, exactly one entry is labelled `Latest` —
        the topmost minor that survives the Talos cap, which is **not**
        necessarily upstream's latest. Every other entry is labelled `Stable`.

        A Talos update never changes a tenant's Kubernetes version (owner ruling
        2026-09-15); it only changes which versions this endpoint can offer.
        The list can therefore shrink underneath a running cluster, and that
        cluster keeps the version it is on.
      security: []
      responses:
        '200':
          description: |
            The offered versions, newest first.

            An empty `items` array is a valid `200`, not an error condition, and
            this endpoint has no failure response of its own. It means the
            version service has resolved nothing yet (cold start, or upstream
            unreachable) or every candidate was excluded by the bounds above.
            While that lasts, cluster creation fails `422` on `k8s_version` and
            upgrades fail `503 versions_unavailable` — so a client should read
            an empty list as "the picker is unavailable", never as "no
            Kubernetes versions exist".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/K8sVersionList'

  /api/v1/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List organizations
      description: Lists organizations the authenticated principal can access.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/organizations/{orgID}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Update an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      summary: Delete an organization
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/members:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Organizations]
      operationId: listMembers
      summary: List organization members
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Organizations]
      operationId: createMember
      summary: Invite an organization member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Member invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/organizations/{orgID}/members/{memberID}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/MemberID'
    get:
      tags: [Organizations]
      operationId: getMember
      summary: Get an organization member
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Organizations]
      operationId: updateMember
      summary: Update an organization member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    delete:
      tags: [Organizations]
      operationId: deleteMember
      summary: Remove an organization member
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/api-tokens:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Organizations]
      operationId: listApiTokens
      summary: List API tokens
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of API tokens (secrets are never returned here).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Organizations]
      operationId: createApiToken
      summary: Create an API token
      description: >-
        Creates a new API token. The raw `token` secret is returned only in this
        response and is never retrievable again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPITokenRequest'
      responses:
        '201':
          description: Token created. Contains the one-time raw secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenWithSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/organizations/{orgID}/api-tokens/{tokenID}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/TokenID'
    get:
      tags: [Organizations]
      operationId: getApiToken
      summary: Get an API token's metadata
      responses:
        '200':
          description: The token metadata (no secret).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Organizations]
      operationId: deleteApiToken
      summary: Revoke an API token
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/webhooks:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhooks
      description: Lists the organization's webhooks. Responses never include the signing secret.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of webhooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Create a webhook
      description: >-
        Registers a webhook endpoint. The server generates the signing secret
        and returns it in this response only — store it now; no later read
        includes it (rotate to obtain a new one). `events` is validated against
        the event-type catalog (see the `Webhook` schema). At most 10 webhooks
        per organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created. Includes the signing secret (shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Webhook limit reached for this organization (`webhook_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/organizations/{orgID}/webhooks/{webhookID}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/WebhookID'
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Get a webhook
      responses:
        '200':
          description: The webhook (without its signing secret).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Update a webhook
      description: >-
        Updates the webhook. All fields are optional; omitted fields are left
        unchanged. Set `enabled` to `false` to pause deliveries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: The updated webhook (without its signing secret).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      responses:
        '204':
          description: Webhook deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/webhooks/{webhookID}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/WebhookID'
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate a webhook's signing secret
      description: >-
        Replaces the signing secret with a newly generated one, effective for
        all subsequent deliveries. The new secret is returned in this response
        only.
      responses:
        '200':
          description: The webhook with its new signing secret (shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/webhooks/{webhookID}/test:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/WebhookID'
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a test delivery
      description: >-
        Enqueues a signed `ping` event to this webhook. It is delivered
        asynchronously by the same worker as real events — proving the full
        delivery path, not just reachability. Check the deliveries listing for
        the outcome.
      responses:
        '202':
          description: Test delivery enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The webhook is disabled (`webhook_disabled`) — enable it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/organizations/{orgID}/webhooks/{webhookID}/deliveries:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/WebhookID'
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      description: Lists the webhook's delivery log, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/tickets:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Support]
      operationId: listTickets
      summary: List support tickets
      description: Lists the organization's support tickets, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Support]
      operationId: createTicket
      summary: Open a support ticket
      description: >-
        Opens a ticket. The ticket's initial `body` is stored as the first
        message, authored by the caller as a `tenant` message. `severity`
        defaults to `low` and `category` to `general` when omitted. The
        `created_by` field is set from the caller's JWT subject (null for API
        tokens).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/organizations/{orgID}/tickets/{ticketID}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/TicketID'
    get:
      tags: [Support]
      operationId: getTicket
      summary: Get a support ticket
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Support]
      operationId: updateTicket
      summary: Update a support ticket
      description: >-
        Updates a ticket's `severity`, `status`, `category`, or `assigned_to`.
        All fields are optional; omitted fields are left unchanged. A `status`
        change must be a legal transition (`closed` is terminal in this phase);
        an illegal transition is rejected with 422 (`invalid_transition`).
        Entering `resolved` stamps `resolved_at`; it is preserved on `closed`
        and cleared only when a resolved ticket is reopened (to `open` or
        `in_progress`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: The updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/organizations/{orgID}/tickets/{ticketID}/messages:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/TicketID'
    get:
      tags: [Support]
      operationId: listTicketMessages
      summary: List ticket messages
      description: Lists the ticket's message thread, oldest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Support]
      operationId: createTicketMessage
      summary: Post a message to a ticket
      description: >-
        Appends a message to the thread. The author is derived from the
        caller's auth context: `author_id` from the JWT subject, `author_type`
        = `provider` when the caller holds the `platform-admin` role, otherwise
        `tenant`. Posting recomputes the ticket's status (a tenant reply
        reopens a `waiting`/`resolved` ticket; a provider reply on an `open`
        ticket moves it to `in_progress`) and stamps `first_response_at` on the
        first provider message — all in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketMessageRequest'
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/organizations/{orgID}/tickets/{ticketID}/attachments:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/TicketID'
    get:
      tags: [Support]
      operationId: listTicketAttachments
      summary: List a ticket's attachments
      description: >-
        Lists the ticket's confirmed (`attached`) attachments, oldest first.
        Pending (reserved-but-unreferenced) uploads are not returned.
      responses:
        '200':
          description: The ticket's attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAttachmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Support]
      operationId: presignTicketAttachmentUpload
      summary: Reserve an attachment and get a presigned upload URL
      description: >-
        Reserves a `pending` attachment slot on the ticket and returns a
        short-lived presigned PUT URL. The client uploads the file **bytes
        directly to object storage** (MinIO/S3) at `upload_url` with a matching
        `Content-Type`; the API never proxies the bytes. The upload is then
        confirmed by referencing the returned `attachment_id` in
        `attachment_ids` on a subsequent message (see the message endpoint) —
        that flips the row to `attached` inside the message transaction.
        Server-side limits: `content_type` must be on the allowlist (images,
        pdf, text, json, yaml, gzip, tar) and `size_bytes` in `(0, 26214400]`
        (25 MiB). Returns **503** when attachment storage is not configured
        (`MINIO_ENDPOINT` unset).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '201':
          description: Attachment reserved; upload URL issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '503':
          description: Attachment storage is not configured.

  /api/v1/organizations/{orgID}/tickets/{ticketID}/attachments/{attachmentID}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/TicketID'
      - $ref: '#/components/parameters/AttachmentID'
    get:
      tags: [Support]
      operationId: downloadTicketAttachment
      summary: Download a ticket attachment
      description: >-
        Redirects (302) to a short-lived presigned GET URL for the attachment
        bytes in object storage. Returns **503** when attachment storage is not
        configured.
      responses:
        '302':
          description: Redirect to the presigned download URL.
