        size_bytes:
          type: integer
          format: int64
          description: File size in bytes; must be in (0, 26214400] (25 MiB).

    PresignUploadResponse:
      type: object
      required: [attachment_id, upload_url]
      properties:
        attachment_id:
          type: string
          format: uuid
          description: Reference this id in a message's `attachment_ids` to confirm the upload.
        upload_url:
          type: string
          format: uri
          description: Short-lived presigned PUT URL; upload bytes directly here with the matching Content-Type.

    AuditEvent:
      type: object
      required: [id, org_id, actor_type, action, resource_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        actor_id:
          type: [string, 'null']
          format: uuid
        actor_type:
          type: string
        actor_email:
          type: [string, 'null']
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: [string, 'null']
          format: uuid
        metadata:
          description: Arbitrary event metadata (any JSON value, may be null).
        ip_address:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: [string, 'null']

    ClusterStatus:
      type: string
      enum: [provisioning, running, upgrading, degraded, deleting, failed]

    Cluster:
      type: object
      required: [id, org_id, name, region, k8s_version, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
        k8s_version:
          type: string
        status:
          $ref: '#/components/schemas/ClusterStatus'
        status_message:
          type: [string, 'null']
        endpoint:
          type: [string, 'null']
          description: >-
            The apiserver URL aether-operator reports for the cluster: the
            private control-plane proxy address, or the public hostname when
            `public_endpoint` is true (which it is on every supported cluster —
            a cluster without the mandatory public endpoint is an
            implementation gap, tracked internally as I-14, see
            `public_endpoint`). Observed, not derived — `null` (and omitted
            from the response) until the cluster has been provisioned far
            enough for the operator to report one.
        observed_kubernetes_version:
          type: [string, 'null']
          description: The version aether-operator reports once a rollout settles.
        capi_cluster_name:
          type: [string, 'null']
        keycloak_realm:
          type: [string, 'null']
        harbor_project:
          type: [string, 'null']
        ceph_pool:
          type: [string, 'null']
        lb_subnet:
          type: [string, 'null']
        worker_subnet:
          type: [string, 'null']
          description: The per-cluster worker /24 (read-only; allocated at create time).
        public_endpoint:
          type: boolean
          description: >-
            Whether this cluster's apiserver is exposed on a public IPv4 and
            DNS name in addition to the private control-plane proxy path.
            Every cluster is required to have one: the public API endpoint is
            mandatory, billed at the published monthly rate for `public_ip`
            (€4 at the time of writing; the current rate is shown in the
            portal and, once published, on the pricing page) as a flat month
            with no proration, locked the first time the billing sampler
            observes the address — one line per cluster per month, see
            `SubscriptionLine.kind` `public_ip`. Set at create time and
            immutable afterwards; sending a different value to updateCluster
            is rejected with 422 public_endpoint/immutable.
            A cluster reading false is an implementation gap (tracked
            internally as I-14), not a supported configuration: the API still
            accepts `public_endpoint: false` at create time, and the resulting
            cluster has no public address, no endpoint charge and no supported
            access path. Its apiserver answers only on the cluster's private
            network — its own workers and the platform — and in production
            there is no supported way to reach it from a laptop or a CI
            pipeline; the kubectl proxy through the platform API
            (`proxy-kubeconfig`, not exposed in this reference) is a preview
            that is switched off in production and, where enabled, reaches
            private and public clusters alike. Private-network connectivity,
            which would make the public endpoint optional, is a future
            capability.
        plan_slug:
          type: [string, 'null']
          description: >-
            The package this cluster is billed from, as chosen at create time:
            one of the package slugs in the catalogue (currently `dev`,
            `starter`, `growth`, `scale`; a retired slug can still appear on an
            existing cluster). `null` (and omitted from the response) means the
            cluster is billed per resource ("custom"). Immutable — no endpoint
            changes it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateClusterRequest:
      type: object
      required: [name, region, k8s_version]
      properties:
        name:
          type: string
        region:
          type: string
        k8s_version:
          type: string
          description: >-
            A supported Kubernetes version as MAJOR.MINOR (e.g. "1.33") or full
            MAJOR.MINOR.PATCH. Bare minors resolve to the latest available
            patch; a full version is accepted only when its minor is offered by
            `GET /api/v1/k8s-versions` and its patch is one this platform has
            resolved (at or below that minor's current `patch`) — otherwise 422
            `validation_error`.
        plan:
          type: string
          examples: [starter]
          description: >-
            The package to bill this cluster from. The catalogue currently
            offers `dev`, `starter`, `growth` and `scale`, but the server
            validates the slug against its own catalogue rather than a fixed
            list, so treat those four as the values available today and not as
            the permitted set. Optional: omitted — or sent as an empty string,
            which is accepted and means the same thing — bills the cluster per
            resource ("custom"), with no package fee and no allowance. A slug
            that is unknown or retired is rejected at create time with 422
            `validation_error` carrying `plan`/`unavailable` in `details`.
            Chosen at create time and immutable afterwards: no update field
            changes it, so moving between packages, or between a package and
            custom, means recreating the cluster.
        public_endpoint:
          type: boolean
          default: false
          description: >-
            The public apiserver endpoint: the cluster's control-plane proxy
            also binds one IPv4 from the region's public pool and the
            apiserver is published at
            <cluster>.<org>.<region>.aetherplatform.cloud. Send true — the
            public API endpoint is mandatory on every cluster, billed at the
            published monthly rate for `public_ip` (€4 at the time of writing;
            the current rate is shown in the portal and, once published, on
            the pricing page) as a flat month with no proration, locked the
            first time the billing sampler observes the address — one charge
            per cluster per month, on top of the cluster's other resources,
            and no package fee includes it.
            The schema default stays false, but omitting the field or sending
            false is an implementation gap (tracked internally as I-14), not a
            supported alternative: the API still accepts it and creates a
            cluster with no public address, no endpoint charge and no
            supported access path. Such a cluster's apiserver answers only on
            its private network — its own workers and the platform — and in
            production there is no supported way to reach it from a laptop or
            a CI pipeline; the kubectl proxy through the platform API
            (`proxy-kubeconfig`, not exposed in this reference) is a preview
            that is switched off in production and, where enabled, reaches
            private and public clusters alike. Private-network connectivity,
            which would make the public endpoint optional, is a future
            capability.
            Immutable after create; a 409 public_ip_pool_exhausted means the
            region has no free address.

    UpdateClusterRequest:
      type: object
      properties:
        name:
          type: string
        k8s_version:
          type: string
        public_endpoint:
          type: boolean
          description: >-
            Immutable. Accepted only when it equals the cluster's current
            value (so a GET can be round-tripped into an update); any other
            value is rejected with 422 public_endpoint/immutable. Recreate the
            cluster to change it — there is no path that turns the public API
            endpoint on or off on an existing cluster. Every cluster is
            required to have one (billed at the published monthly rate for
            `public_ip`, €4 at the time of writing, as a flat month locked the
            first time the billing sampler observes the address), so a cluster
            sitting at false is an implementation gap (tracked internally as
            I-14), not a supported configuration: it has no public address and
            no supported access path, and the only remedy is to recreate it
            with `public_endpoint: true`.
            `plan` is immutable in the same way and has no field here at all.

    ClusterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
        next_cursor:
          type: [string, 'null']

    K8sVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: >-
            The offered versions, newest first. Never `null`; an unwarmed or
            fully-excluded version service yields an empty array. This endpoint
            is not paginated and emits no `next_cursor`.
          items:
            $ref: '#/components/schemas/K8sVersionInfo'

    K8sVersionInfo:
      type: object
      required: [version, label, patch]
      properties:
        version:
          type: string
          description: >-
            The Kubernetes MINOR version — `1.37`, not `1.37.4`. Pass it back as
            `k8s_version` on cluster creation or `target_version` on upgrade,
            where it resolves to the latest patch Aether has verified for that
            minor.
          examples: ['1.37']
        label:
          type: string
          enum: [Latest, Stable]
          description: >-
            `Latest` marks the newest offered minor and appears on exactly one
            entry. It is the topmost minor that survives the Talos cap, which is
            not necessarily upstream's latest release. Every other entry is
            `Stable`.
          examples: [Latest]
        patch:
          type: string
          description: >-
            The full version this minor currently resolves to — `1.37.0` for
            `version` `1.37` — with no leading `v`. Always present on an offered
            entry: a minor whose patch cannot be resolved is dropped from the
            list rather than advertised. Display-oriented (`Latest — 1.37.0`);
            it is not a stable identifier, since the same minor resolves to a
            newer patch as upstream publishes one. Send `version` back on
            create/upgrade, or send an explicit published patch of an offered
            minor.
          examples: ['1.37.0']

    APIServerRateLimit:
      type: object
      required: [max_connections_per_second, burst]
      properties:
        max_connections_per_second:
          type: integer
          minimum: 1
        burst:
          type: integer
          minimum: 1

    ClusterNetwork:
      type: object
      required: [cluster_id, authorized_cidrs, updated_at]
      properties:
        cluster_id:
          type: string
          format: uuid
        authorized_cidrs:
          type: array
          items:
            type: string
          description: >-
            Source-IP allowlist (CIDRs) for reaching the cluster's control
            plane. An empty list means connections are accepted from any source
            address; authentication still applies. Send at least one CIDR to
            restrict it. The list restricts the public control-plane endpoint —
            where the cluster's own workers and the platform are always allowed
            in addition to it — and, where the platform kubectl proxy is
            enabled, connections made through it, which are matched against
            these entries alone — a private cluster reached through the proxy is
            matched like any other. It has no effect on the private
            control-plane path itself, which has no public listener.
        api_server_rate_limit:
          oneOf:
            - $ref: '#/components/schemas/APIServerRateLimit'
            - type: 'null'
        updated_at:
          type: string
          format: date-time

    UpsertClusterNetworkRequest:
      type: object
      required: [authorized_cidrs]
      properties:
        authorized_cidrs:
          type: array
          items:
            type: string
          description: >-
            Source-IP allowlist (CIDRs) for reaching the cluster's control
            plane. An empty list means connections are accepted from any source
            address; authentication still applies. Send at least one CIDR to
            restrict it. The list restricts the public control-plane endpoint —
            where the cluster's own workers and the platform are always allowed
            in addition to it — and, where the platform kubectl proxy is
            enabled, connections made through it, which are matched against
            these entries alone — a private cluster reached through the proxy is
            matched like any other. It has no effect on the private
            control-plane path itself, which has no public listener. Replaces
            the stored list outright; every entry must be CIDR notation, and a
            bare address is rejected with 422 authorized_cidrs/invalid_cidr.
        api_server_rate_limit:
          oneOf:
            - $ref: '#/components/schemas/APIServerRateLimit'
            - type: 'null'

    UpgradeRequest:
      type: object
      required: [target_version]
      properties:
        target_version:
          type: string
          description: >-
            The target Kubernetes version as MAJOR.MINOR (e.g. "1.37") or full
            MAJOR.MINOR.PATCH. Bare minors resolve to the latest available
            patch; a full version is accepted only when its minor is offered by
            `GET /api/v1/k8s-versions` and its patch is one this platform has
            resolved (at or below that minor's current `patch`) — otherwise 422
            `validation_error`. Must also be an incremental step from the
            cluster's current version: a patch bump on the same minor, or a
            step to exactly the next minor.

    UpgradeResponse:
      type: object
      description: >-
        The updated cluster plus worker-rollout counters. When worker patching
        partially fails, additional fields (workers_pending, workers_error) are
        present.
      properties:
        cluster:
          $ref: '#/components/schemas/Cluster'
        workers_patched:
          type: integer
        workers_skipped:
          type: integer
        workers_pending:
          type: boolean
        workers_error:
          type: string

    NodePoolStatus:
      type: string
      enum: [provisioning, ready, scaling, deleting, failed]

    NodeTaint:
      type: object
      required:
        - key
        - effect
      properties:
        key:
          type: string
        value:
          type: string
        effect:
          type: string
          enum: [NoSchedule, PreferNoSchedule, NoExecute]

    NodePool:
      type: object
      required:
        - id
        - cluster_id
        - name
        - vcpus
        - memory_gb
        - disk_gb
        - min_nodes
        - max_nodes
        - desired_nodes
        - current_nodes
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        name:
          type: string
        vcpus:
          type: integer
        memory_gb:
          type: integer
        disk_gb:
          type: integer
        min_nodes:
          type: integer
        max_nodes:
          type: integer
        desired_nodes:
          type: integer
        min_vcpus:
          type: integer
          description: >-
            Optional per-pool CPU autoscaling budget (total pool vCPUs); max > min ⇒ autoscaling.
            A non-zero minimum must cover at least one node; set BOTH min_vcpus and
            min_memory_gb to 0 (with the maxima set) to let the pool scale to zero
            nodes.
        max_vcpus:
          type: integer
          description: Optional per-pool CPU autoscaling budget (total pool vCPUs); max > min ⇒ autoscaling.
        min_memory_gb:
          type: integer
          description: >-
            Optional per-pool memory autoscaling budget (total pool GB); max > min ⇒ autoscaling.
            A non-zero minimum must cover at least one node; set BOTH min_vcpus and
            min_memory_gb to 0 (with the maxima set) to let the pool scale to zero
            nodes.
        max_memory_gb:
          type: integer
          description: Optional per-pool memory autoscaling budget (total pool GB); max > min ⇒ autoscaling.
        node_labels:
          type: object
          additionalProperties:
            type: string
          description: Labels applied to the pool's nodes at bootstrap.
        node_taints:
          type: array
          items:
            $ref: '#/components/schemas/NodeTaint'
          description: Taints applied to the pool's nodes at bootstrap (set at create; immutable).
        drain_timeout_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: >-
            How long the platform drains a node in this pool before deleting it
            anyway. Omitted when the pool has none configured, which means the
            platform default of 600s applies (and keeps applying if that default
            changes).
        scale_down_delay_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: >-
            How long a node in this pool must stay underutilised before the
            autoscaler removes it. Omitted when the pool has none configured,
            which means the platform default of 600s applies (and keeps applying
            if that default changes). Acts on the scale-down DECISION;
            drain_timeout_seconds bounds the removal once it is decided. Only
            autoscaling pools have an autoscaler node group, so on a fixed pool
            the value is stored and reported but has no effect.
        scale_down_utilization_percent:
          type: integer
          minimum: 10
          maximum: 90
          description: >-
            A node counts as underutilised when its CPU and memory requests are
            both below this share of allocatable capacity. Omitted when the pool
            has none configured, which means the platform default of 50 applies.
        current_nodes:
          type: integer
        first_ready_at:
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/NodePoolStatus'
        status_message:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateNodePoolRequest:
      type: object
      required: [name, vcpus, memory_gb, disk_gb]
      properties:
        name:
          type: string
        vcpus:
          type: integer
          minimum: 1
          maximum: 128
        memory_gb:
          type: integer
          minimum: 1
          maximum: 512
        disk_gb:
          type: integer
          minimum: 1
          maximum: 2048
        min_nodes:
          type: [integer, 'null']
          minimum: 0
        max_nodes:
          type: [integer, 'null']
          minimum: 0
        desired_nodes:
          type: [integer, 'null']
          minimum: 0
        min_vcpus:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Optional per-pool CPU autoscaling budget (total pool vCPUs); max > min ⇒ autoscaling.
            A non-zero minimum must cover at least one node; set BOTH min_vcpus and
            min_memory_gb to 0 (with the maxima set) to let the pool scale to zero
            nodes.
        max_vcpus:
          type: [integer, 'null']
          minimum: 1
          description: Optional per-pool CPU autoscaling budget (total pool vCPUs); max > min ⇒ autoscaling.
        min_memory_gb:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Optional per-pool memory autoscaling budget (total pool GB); max > min ⇒ autoscaling.
            A non-zero minimum must cover at least one node; set BOTH min_vcpus and
            min_memory_gb to 0 (with the maxima set) to let the pool scale to zero
            nodes.
        max_memory_gb:
          type: [integer, 'null']
          minimum: 1
          description: Optional per-pool memory autoscaling budget (total pool GB); max > min ⇒ autoscaling.
        node_labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Labels applied to the pool's nodes at bootstrap. Reserved key
            prefixes (`aether.cloud/`, `kubernetes.io/`, `k8s.io/`,
            `node-role.kubernetes.io/`, `node.kubernetes.io/`) are rejected.
        node_taints:
          type: array
          items:
            $ref: '#/components/schemas/NodeTaint'
          description: >-
            Taints applied to the pool's nodes at bootstrap (create-only;
            immutable thereafter). Reserved key prefixes (`aether.cloud/`,
            `kubernetes.io/`, `k8s.io/`, `node-role.kubernetes.io/`,
            `node.kubernetes.io/`) are rejected, and a cluster must retain at
            least one pool with no `NoSchedule`/`NoExecute` taint.
        drain_timeout_seconds:
          type: [integer, 'null']
          minimum: 30
          maximum: 3600
          description: >-
            How long to drain a node in this pool before deleting it anyway.
            Omit it (or send null) to use the platform default of 600s — the
            pool then tracks that default rather than being pinned to today's
            value. 0 is rejected: it means "wait forever" to the underlying
            machinery, and one pod that refuses to evict would hang the pool's
            teardown indefinitely.
        scale_down_delay_seconds:
          type: [integer, 'null']
          minimum: 60
          maximum: 3600
          description: >-
            How long a node in this pool must stay underutilised before the
            autoscaler removes it. Omit it (or send null) to use the platform
            default of 600s — the pool then tracks that default rather than
            being pinned to today's value. This acts on the scale-down DECISION,
            while drain_timeout_seconds bounds the removal once it is decided.
            Accepted on any pool, but only autoscaling pools have an autoscaler
            node group, so on a fixed pool it is inert.
        scale_down_utilization_percent:
          type: [integer, 'null']
          minimum: 10
          maximum: 90
          description: >-
            A node counts as underutilised when its CPU and memory requests are
            both below this share of allocatable capacity. Omit it (or send
            null) to use the platform default of 50.

