        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clusters]
      operationId: updateNodePool
      summary: Update a node pool
      description: >-
        Partial update. Any omitted field keeps its stored value. The merged
        result must satisfy `min_nodes <= desired_nodes <= max_nodes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodePoolRequest'
      responses:
        '200':
          description: The updated node pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePool'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    delete:
      tags: [Clusters]
      operationId: deleteNodePool
      summary: Delete a node pool
      responses:
        '202':
          description: Node pool teardown started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/clusters/{clusterID}/nodepools/{poolID}/machines:
    parameters:
      - $ref: '#/components/parameters/OrgID'
