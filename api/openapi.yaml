  /api/v1/admin/whoami:
    get:
      tags: [Admin]
      operationId: adminWhoami
      summary: Echo the authenticated admin's identity and roles
      description: >-
        Returns the calling admin's email and Keycloak realm roles. Doubles as a
        liveness check that the `platform-admin` gate is wired correctly. Like
        the whole `/api/v1/admin` tree, this requires the `platform-admin` realm
        role and rejects API tokens (which carry no roles) with 403.
      responses:
        '200':
          description: The authenticated admin's identity.
          content:
            application/json:
              schema:
                type: object
                required: [email, roles]
                properties:
                  email:
                    type: string
                    description: The admin's email, from the JWT `email` claim.
                  roles:
                    type: array
                    description: Keycloak realm roles from `realm_access.roles`.
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/rate-card:
    get:
      tags: [Admin]
      operationId: adminGetRateCard
      summary: Get the current effective customer rate card
      description: >-
        Returns the live €/month price per resource type — the newest
        effective-dated `rate_cards` row per type with `effective_from <= now()`.
        Requires the `platform-admin` realm role.
      responses:
        '200':
          description: The current effective rates, keyed by resource type.
          content:
            application/json:
              schema:
                type: object
                required: [rates]
                properties:
                  rates:
                    type: object
                    description: >-
                      Map of resource_type -> €/month unit price. Keys are the
                      ten resource types of the rate card (see the enum on
                      updateRateCard).
                    additionalProperties:
                      type: number
                      format: double
                    example:
                      control_plane: 0
                      vcpu: 8
                      memory: 3.5
                      disk: 0.12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Admin]
      operationId: adminUpdateRateCard
      summary: Update the customer rate card
      description: >-
        Appends a new effective-now `rate_cards` row per submitted resource type
        and refreshes the in-process rate card so the change is live immediately.
        Each line is validated against the resource-type enum and the
        non-negative price constraint; a duplicated resource_type in one request
        is rejected. Requires the `platform-admin` realm role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rates]
              properties:
                rates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [resource_type, unit_price_eur]
                    properties:
                      resource_type:
                        type: string
                        enum: [control_plane, vcpu, memory, disk, storage_block,
                               storage_rwx, loadbalancer, registry, snapshot, public_ip]
                      unit_price_eur:
                        type: number
                        format: double
                        minimum: 0
                        description: €/month unit price (non-negative).
            example:
              rates:
                - resource_type: control_plane
                  unit_price_eur: 0
                - resource_type: vcpu
                  unit_price_eur: 6.5
      responses:
        '200':
          description: The updated current effective rates.
          content:
            application/json:
              schema:
                type: object
                required: [rates]
                properties:
                  rates:
                    type: object
                    additionalProperties:
                      type: number
                      format: double
        '400':
          description: >-
            Invalid body — unknown resource_type, negative price, duplicate
            resource_type, or empty rates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/rate-card/history:
    get:
      tags: [Admin]
      operationId: adminGetRateCardHistory
      summary: List recent rate-card changes
      description: >-
        Returns recent `rate_cards` rows newest-first (the effective-dated price
        history). Requires the `platform-admin` realm role.
      responses:
        '200':
          description: Recent rate-card rows, newest-first.
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      required: [resource_type, unit_price_eur, effective_from, created_by, created_at]
                      properties:
                        resource_type:
                          type: string
                          enum: [control_plane, vcpu, memory, disk, storage_block,
                                 storage_rwx, loadbalancer, registry, snapshot, public_ip]
                        unit_price_eur:
                          type: number
                          format: double
                        effective_from:
                          type: string
                          format: date-time
                        created_by:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/organizations/{orgID}/storage-quota:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Admin]
      operationId: adminGetSharedStorageQuota
      summary: Get an organization's shared-storage quota
      description: >-
        Returns the org's configured shared-storage (CephFS) cap alongside the
        platform default and, when the management cluster can be reached, the
        quota ceph is actually enforcing and the bytes already written. The
        observation is best-effort: an unreachable management cluster leaves
        both observed members `null` rather than failing the request. Requires
        the `platform-admin` realm role.
      responses:
        '200':
          description: The org's configured, effective and observed quota figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedStorageQuota'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin]
      operationId: adminSetSharedStorageQuota
      summary: Set or revert an organization's shared-storage quota
      description: >-
        Sets the org's shared-storage cap and publishes it to the org's
        `StorageInventory` so a raise takes effect immediately; the provisioner
        syncer is the durable path, so a failed publish is logged rather than
        returned. A `null` `quota_gb` REVERTS the org to the platform default
        and publishes a REMOVAL of `spec.sharedQuotaBytes` from the org's
        `StorageInventory` (never `0` — ceph reads `0` as unlimited, the exact
        inversion of a revert).


        Lowering is pre-flighted against the bytes already stored and rejected
        with `409` when it would fall below them: ceph accepts such a quota and
        then refuses every write to the pool until usage drops, an org-wide
        outage whose only undo is raising the quota back. The check is advisory
        — when no observed figure is available it is skipped, because a
        `StorageInventory` with no status yet is the ordinary state of a young
        org.


        The change is recorded in the admin audit log with its before and after
        values. Requires the `platform-admin` realm role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quota_gb]
              properties:
                quota_gb:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 10240
                  description: >-
                    The cap in GiB, between 1 and 10240, or `null` to revert to
                    the platform default. `1` is the floor because `0` means
                    UNLIMITED to ceph.
            example:
              quota_gb: 200
      responses:
        '200':
          description: The stored quota, with the observed figures when available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedStorageQuota'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            `quota_below_usage` — the requested cap is below the bytes already
            stored in the org's pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/admin/tickets:
    get:
      tags: [Admin]
      operationId: adminListTickets
      summary: List tickets across all orgs
      description: >-
        Lists support tickets across every organization, newest first, for
        platform staff. Narrow the result with the optional `status`,
        `severity`, `category`, `org_id`, and `assigned` query parameters.
        Requires the `platform-admin` realm role.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_progress, waiting, resolved, closed]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [cluster, networking, storage, identity, billing, feature_request, general]
        - name: org_id
          in: query
          required: false
          description: Restrict to a single organization.
          schema:
            type: string
            format: uuid
        - name: assigned
          in: query
          required: false
          description: >-
            `unassigned` for tickets with no assignee, or a user UUID for
            tickets assigned to that staff member. Omit for any.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of tickets across all orgs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '400':
          description: >-
            Invalid query — malformed `org_id`, or `assigned` that is neither
            `unassigned` nor a user UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/tickets/{ticketID}:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    get:
      tags: [Admin]
      operationId: adminGetTicket
      summary: Get any ticket
      description: >-
        Fetches a ticket from any organization (no org scope). Requires the
        `platform-admin` realm role.
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin]
      operationId: adminUpdateTicket
      summary: Update any ticket (assign / status / severity / category)
      description: >-
        Updates a ticket's `severity`, `status`, `category`, or `assigned_to`
        without an org scope. All fields are optional; omitted fields are left
        unchanged. Uses the admin transition matrix, which additionally permits
        reopening a `closed` ticket (to `open` or `in_progress`); an illegal
        transition is rejected with 422 (`invalid_transition`). Requires the
        `platform-admin` realm role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: The updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/admin/tickets/{ticketID}/messages:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    get:
      tags: [Admin]
      operationId: adminListTicketMessages
      summary: List any ticket's messages
      description: >-
        Lists a ticket's message thread (no org scope), oldest first. Requires
        the `platform-admin` realm role.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Admin]
      operationId: adminCreateTicketMessage
      summary: Reply to a ticket as provider
      description: >-
        Appends a provider-authored message (`author_type` = `provider`,
        `author_id` from the caller's JWT subject) to any ticket's thread. In
        one transaction it recomputes the ticket's status (a provider reply on
        an `open` ticket moves it to `in_progress`), stamps `first_response_at`
        on the first provider message, and enqueues the `ticket.updated`
        webhook. A notification email to the tenant is sent best-effort after
        commit. Requires the `platform-admin` realm role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketMessageRequest'
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/admin/tickets/{ticketID}/attachments:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    get:
      tags: [Support]
      operationId: adminListTicketAttachments
      summary: List any ticket's attachments (admin)
      description: >-
        Lists a ticket's confirmed attachments across any org, oldest first.
        Requires the `platform-admin` realm role.
      responses:
        '200':
          description: The ticket's attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAttachmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Support]
      operationId: adminPresignTicketAttachmentUpload
      summary: Reserve an attachment on any ticket (admin)
      description: >-
        Provider-side equivalent of the tenant presign-upload: reserves a
        `pending` attachment on any ticket (the ticket's org is resolved for the
        metadata row) and returns a presigned PUT URL. Same allowlist/size
        limits and 503-when-unconfigured behavior. Confirm by referencing the
        `attachment_id` in `attachment_ids` on a provider reply. Requires the
        `platform-admin` realm role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '201':
          description: Attachment reserved; upload URL issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '503':
          description: Attachment storage is not configured.

  /api/v1/admin/tickets/{ticketID}/attachments/{attachmentID}:
    parameters:
      - $ref: '#/components/parameters/TicketID'
      - $ref: '#/components/parameters/AttachmentID'
    get:
      tags: [Support]
      operationId: adminDownloadTicketAttachment
      summary: Download any ticket's attachment (admin)
      description: >-
        Redirects (302) to a short-lived presigned GET URL for the attachment
        bytes. No org scope. Returns 503 when storage is unconfigured. Requires
        the `platform-admin` realm role.
      responses:
        '302':
          description: Redirect to the presigned download URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Attachment storage is not configured.

components:
  securitySchemes:
    bearerApiToken:
      type: http
      scheme: bearer
      description: >-
        An Aether API token of the form `aether_<hex>`, sent as
        `Authorization: Bearer <token>`.

  parameters:
    OrgID:
      name: orgID
      in: path
      required: true
      description: Organization UUID.
      schema:
        type: string
        format: uuid
    MemberID:
      name: memberID
      in: path
      required: true
      description: Member UUID.
      schema:
        type: string
        format: uuid
    TokenID:
      name: tokenID
      in: path
      required: true
      description: API token UUID.
      schema:
        type: string
        format: uuid
    WebhookID:
      name: webhookID
      in: path
      required: true
      description: Webhook UUID.
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticketID
      in: path
      required: true
      description: Support ticket UUID.
      schema:
        type: string
        format: uuid
    AttachmentID:
      name: attachmentID
      in: path
      required: true
      description: Ticket attachment UUID.
      schema:
        type: string
        format: uuid
    ClusterID:
      name: clusterID
      in: path
      required: true
      description: Cluster UUID.
      schema:
        type: string
        format: uuid
    PoolID:
      name: poolID
      in: path
      required: true
      description: Node pool UUID.
      schema:
        type: string
        format: uuid
    InvoiceID:
      name: invoiceID
      in: path
      required: true
      description: Invoice UUID.
      schema:
        type: string
        format: uuid
    PaymentMethodID:
      name: pmID
      in: path
      required: true
      description: Payment method UUID.
      schema:
        type: string
        format: uuid
    RepoName:
      name: repoName
      in: path
      required: true
      description: Repository name (org-scoped repo path segment).
      schema:
        type: string
    TagName:
      name: tag
      in: path
      required: true
      description: Tag name.
      schema:
        type: string
    AccountID:
      name: accountID
      in: path
      required: true
      description: Robot account identifier.
      schema:
        type: string
    PolicyID:
      name: policyID
      in: path
      required: true
      description: Cleanup policy identifier.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor (a UUID) for pagination; pass back the prior page's next_cursor.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items per page (1-100, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    BadRequest:
      description: >-
        Malformed request — e.g. an invalid path UUID or an unparseable JSON
        body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >-
        The credential was accepted but lacks the required role or access
        (e.g. a non-`platform-admin` calling an `/api/v1/admin` endpoint).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The resource already exists or conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationErrorResponse:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required backend dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A stable, machine-readable error code.
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          description: A short status word, e.g. "deleting", "deleted", or "ok".

    Organization:
      type: object
      required: [id, name, slug, plan, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        billing_email:
          type: [string, 'null']
        vat_id:
          type: [string, 'null']
        plan:
          type: string
          readOnly: true
          description: >-
            Legacy organization field, always `starter`; not settable through
            the API and unrelated to a cluster's package (`plan` on
            createCluster).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        billing_email:
          type: [string, 'null']
        vat_id:
          type: [string, 'null']

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        billing_email:
          type: [string, 'null']
        vat_id:
          type: [string, 'null']

    OrganizationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: [string, 'null']

    Member:
      type: object
      required: [id, org_id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, member, viewer]
        invited_by:
          type: [string, 'null']
          format: uuid
        accepted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, member, viewer]

    UpdateMemberRequest:
      type: object
      properties:
        role:
          type: string
          enum: [owner, admin, member, viewer]

    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          type: [string, 'null']

    APIToken:
      type: object
      required: [id, org_id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The non-secret token prefix, for display/identification.
        scopes:
          type: array
          items:
            type: string
        last_used_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    APITokenWithSecret:
      allOf:
        - $ref: '#/components/schemas/APIToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >-
                The raw API token (`aether_<hex>`). Shown only once, at creation.

    CreateAPITokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: [string, 'null']
          description: Optional expiry timestamp (RFC 3339).

    APITokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/APIToken'
        next_cursor:
          type: [string, 'null']

    Webhook:
      type: object
      required: [id, org_id, url, description, events, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        url:
          type: string
          description: >-
            Delivery endpoint. Must be `https`, without embedded credentials,
            and must not point at private or internal address ranges.
        description:
          type: string
        events:
          type: array
          items:
            type: string
          description: >-
            Subscribed event types, validated against the catalog:
            `cluster.created`, `cluster.ready`, `cluster.upgraded`,
            `cluster.degraded`, `cluster.deleted`, `node.replaced`,
            `usage.alert`, `invoice.generated`, `ticket.updated` — or exactly
            `["*"]` to subscribe to every catalog type. `usage.alert` fires once
            per budget threshold crossed in a month; its payload is
            `{budget_eur, spend_eur, threshold_pct, billing_month}`.
            `invoice.generated` fires at month close when an org's invoice is
            generated; its payload is
            `{invoice_id, amount_cents, currency, period_start, period_end}`.
            `ticket.updated` fires whenever a support ticket is created, receives
            a new message, or changes status; its payload is
            `{ticket_id, status, severity, category, last_message_author_type,
            updated_at}` where `last_message_author_type` is `tenant` or
            `provider` for a message event and empty (`""`) for a status-only
            change.
        enabled:
          type: boolean
          description: Disabled webhooks receive no deliveries.
        secret:
          type: string
          description: >-
            Server-generated signing secret (`whsec_<hex>`). Returned once —
            present only in create and rotate-secret responses; list and get
            never include it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          description: >-
            Delivery endpoint. Must be `https`, without embedded credentials,
            and must not point at private or internal address ranges.
        description:
          type: string
        events:
          type: array
          items:
            type: string
          description: >-
            Event types to subscribe to (see the `Webhook.events` catalog), or
            exactly `["*"]` for all of them.

    UpdateWebhookRequest:
      type: object
      description: All fields are optional; omitted fields are left unchanged.
      properties:
        url:
          type: string
        description:
          type: string
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        next_cursor:
          type: [string, 'null']

    WebhookDelivery:
      type: object
      required: [id, webhook_id, event_id, event_type, status, attempts, next_attempt_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        webhook_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          description: >-
            Event identity, shared by every endpoint's delivery of the same
            event and sent as `X-Aether-Event-Id`. Delivery is at-least-once —
            deduplicate on it.
        event_type:
          type: string
        status:
          type: string
          enum: [pending, succeeded, dead]
        attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_status_code:
          type: integer
          description: HTTP status returned by the endpoint on the last attempt, if any.
        last_error:
          type: string
          description: Failure summary of the last attempt; absent after success.
        delivered_at:
          type: string
          format: date-time
          description: Set when the delivery succeeded.
        created_at:
          type: string
          format: date-time

    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        next_cursor:
          type: [string, 'null']

    Ticket:
      type: object
      required: [id, org_id, subject, category, severity, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        cluster_id:
          type: [string, 'null']
          format: uuid
          description: Optional cluster this ticket concerns.
        subject:
          type: string
        category:
          type: string
          enum: [cluster, networking, storage, identity, billing, feature_request, general]
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, in_progress, waiting, resolved, closed]
        created_by:
          type: [string, 'null']
          format: uuid
          description: JWT subject of the opener; null for API-token requests.
        assigned_to:
          type: [string, 'null']
          format: uuid
        first_response_at:
          type: [string, 'null']
          format: date-time
          description: Set when the first `provider` message is posted.
        resolved_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Set when the ticket enters `resolved`; cleared only when a resolved
            ticket is reopened (to `open`/`in_progress`); preserved on close.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTicketRequest:
      type: object
      required: [subject, body]
      properties:
        cluster_id:
          type: string
          format: uuid
          description: Optional cluster this ticket concerns.
        subject:
          type: string
        category:
          type: string
          enum: [cluster, networking, storage, identity, billing, feature_request, general]
          description: Defaults to `general` when omitted.
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: Defaults to `low` when omitted.
        body:
          type: string
          description: The initial message body (stored as the first tenant message).

    UpdateTicketRequest:
      type: object
      description: All fields are optional; omitted fields are left unchanged.
      properties:
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, in_progress, waiting, resolved, closed]
          description: >-
            Must be a legal transition from the current status (`closed` is
            terminal in this phase). An illegal move returns 422 with code
            `invalid_transition`.
        category:
          type: string
          enum: [cluster, networking, storage, identity, billing, feature_request, general]
        assigned_to:
          type: string
