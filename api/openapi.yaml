  /api/v1/organizations/{orgID}/registry:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Registry]
      operationId: getRegistry
      summary: Get the organization's registry
      description: >-
        Returns the registry record, or `{"enabled": false}` when no registry has
        been provisioned for the organization.
      responses:
        '200':
          description: The registry, or a disabled indicator.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Registry'
                  - $ref: '#/components/schemas/RegistryDisabled'
