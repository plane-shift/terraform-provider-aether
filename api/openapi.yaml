  /api/v1/organizations/{orgID}/clusters/{clusterID}/upgrade:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/ClusterID'
    post:
      tags: [Clusters]
      operationId: upgradeCluster
      summary: Upgrade a cluster's Kubernetes version
      description: >-
        Initiates a Kubernetes version upgrade across the control plane and worker
        node pools. Upgrades must be incremental: a patch bump on the same minor or
        a step to exactly the next minor. The cluster must be `running`.

        `target_version` accepts the same two forms as cluster creation. A bare
        minor resolves to the latest patch Aether has verified for it; a full
        `MAJOR.MINOR.PATCH` is accepted only when its minor is offered by
        `GET /api/v1/k8s-versions` and its patch is one this platform has
        resolved (at or below that minor's current `patch`) — otherwise 422
        `validation_error`. When no version is offered at all (upstream release
        data has never been reachable) the endpoint answers `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeRequest'
      responses:
        '202':
          description: Upgrade accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The cluster is not in a state that permits upgrade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

