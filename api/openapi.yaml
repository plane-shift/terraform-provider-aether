      properties:
        stripe_pm_id:
          type: string
          description: The Stripe payment method ID to attach.
        is_default:
          type: boolean

    SharedStorageQuota:
      type: object
      description: >-
        An organization's shared-storage (CephFS) cap: what is configured, what
        applies, and what the cluster actually reports. Every optional member is
        nullable rather than absent — a `0` quota would read as "unlimited", and
        a `0` observed pair would claim the org has no cap and has written
        nothing, neither of which can be asserted without a figure.
      required: [configured_gb, effective_gb, default_gb, observed_quota_bytes, observed_used_bytes]
      properties:
        configured_gb:
          type: [integer, 'null']
          description: >-
            The per-org cap in GiB, or `null` when none is set and the platform
            default applies.
        effective_gb:
          type: integer
          description: The cap in force — `configured_gb` when set, otherwise `default_gb`.
        default_gb:
          type: integer
          description: The platform default cap in GiB.
        observed_quota_bytes:
          type: [integer, 'null']
          format: int64
          description: >-
            The quota ceph is currently ENFORCING on the org's CephFS data pool
            — the configured-vs-observed drift readout. `null` when the
            management cluster has published no figure or could not be reached.
        observed_used_bytes:
          type: [integer, 'null']
          format: int64
          description: >-
            Bytes already written to that pool. `null` under the same conditions
            as `observed_quota_bytes`.
