          maximum: 3600
          description: >-
            How long to drain a node in this pool before deleting it anyway.
            Omitting the field leaves whatever the pool already has, and an
            explicit null is accepted but treated identically (no change) rather
            than as a reset — a configured timeout cannot be cleared back to the
            platform default through this endpoint. 0 is rejected — see
            CreateNodePoolRequest.
        scale_down_delay_seconds:
          type: [integer, 'null']
          minimum: 60
          maximum: 3600
          description: >-
            How long a node in this pool must stay underutilised before the
            autoscaler removes it. Omitting the field leaves whatever the pool
            already has, and an explicit null is accepted but treated identically
            (no change) rather than as a reset — a configured value cannot be
            cleared back to the platform default through this endpoint. See
            CreateNodePoolRequest for the meaning and the accepted range.
        scale_down_utilization_percent:
          type: [integer, 'null']
          minimum: 10
          maximum: 90
          description: >-
            A node counts as underutilised when its CPU and memory requests are
            both below this share of allocatable capacity. Omitting the field
            (or sending null) leaves whatever the pool already has; there is no
            way to clear back to the platform default through this endpoint.

