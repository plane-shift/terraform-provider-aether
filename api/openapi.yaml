      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        message_id:
          type: [string, 'null']
          format: uuid
          description: The message this attachment was confirmed onto; null while pending.
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        status:
          type: string
