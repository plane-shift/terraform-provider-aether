  /api/v1/organizations/{orgID}/clusters/{clusterID}/volumes:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/ClusterID'
    get:
      tags: [Clusters]
      operationId: listClusterVolumes
      summary: List a cluster's persistent volumes
      description: >-
        Read-only inventory of the cluster's PersistentVolumes, read from the
        organization's `StorageInventory` on the management cluster (nothing
        here calls the tenant cluster's own apiserver, and there is no delete
        path — volume lifecycle stays a `kubectl delete pvc` inside the
        tenant).


        Both byte figures are reported for every volume, and `billed_on` says
        which of the two is charged: `aether-block` volumes bill on
        `provisioned_bytes` (RBD space is reserved, so an empty claim costs
        what a full one does), `aether-shared` volumes bill on `used_bytes`
        (CephFS is thin-provisioned). `used_percent` is computed server-side and
        is **not** clamped — CephFS enforces its per-subvolume quota lazily, so
        a value above 100 is legitimate — and is `0` when there is no quota to
        divide by.


        When the management read fails, the snapshot is stale or not Ready, or
        the cluster is not provisioned far enough to be identified,
        `inventory_available` is `false` and `volumes` is an empty array: "you
        have no volumes" and "we could not look" are different answers.
      responses:
        '200':
          description: >-
            The cluster's volumes, plus the organization-wide shared-pool
            figures and the freshness of the underlying snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [volumes, org_shared_quota_bytes, org_shared_used_bytes, inventory_available, last_synced_at]
                properties:
                  volumes:
                    type: array
                    items:
                      type: object
                      required: [id, name, type, storage_class, provisioned_bytes, used_bytes, used_percent, billed_on, state, watchers, created_at]
                      properties:
                        id:
                          type: string
                          description: The CSI volume handle (block) or subvolume name (shared).
                        name:
                          type: string
                          description: The volume's display name.
                        type:
                          type: string
                          enum: [block, shared]
                        storage_class:
                          type: string
                          enum: [aether-block, aether-shared]
                        provisioned_bytes:
                          type: integer
                          format: int64
                          description: >-
                            The RBD image size for block volumes, or the
                            subvolume's quota for shared ones — where `0` means
                            an INFINITE quota, not an empty volume.
                        used_bytes:
                          type: integer
                          format: int64
                        used_percent:
                          type: number
                          format: double
                          description: >-
                            Used over provisioned, in percent. Unclamped (may
                            exceed 100), and `0` when provisioned is `0`.
                        billed_on:
                          type: string
                          enum: [provisioned, used]
                          description: Which of the two byte figures this volume is charged on.
                        state:
                          type: string
                          description: The volume's state as reported by the management cluster.
                        watchers:
                          type: integer
                          description: Open RBD watchers (0 means nothing has the image mapped).
                        created_at:
                          type: string
                          format: date-time
                  org_shared_quota_bytes:
                    type: integer
                    format: int64
                    description: >-
                      The hard, OSD-enforced quota on the ORGANIZATION's CephFS
                      data pool, which every cluster in the org shares. `0`
                      means unlimited/unset. Display only — nothing in billing
                      reads it.
                  org_shared_used_bytes:
                    type: integer
                    format: int64
                    description: >-
                      How much of that org-wide pool is occupied — not the sum
                      of this cluster's volumes.
                  inventory_available:
                    type: boolean
                    description: >-
                      `false` when the management read failed or the snapshot is
                      not provably current, in which case `volumes` is empty.
                  last_synced_at:
                    type: string
                    format: date-time
                    description: >-
                      When the organization's inventory last completed a full
                      sync. The zero time when `inventory_available` is `false`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{orgID}/clusters/{clusterID}/nodepools:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/ClusterID'
    get:
      tags: [Clusters]
      operationId: listNodePools
      summary: List node pools
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of node pools.
          content:
