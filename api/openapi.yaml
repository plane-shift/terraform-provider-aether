        author_type:
          type: string
          enum: [tenant, provider]
        body:
          type: string
        attachments:
          type: array
          description: Opaque legacy attachments blob (structured attachments arrive in a later phase).
          items: {}
        created_at:
          type: string
          format: date-time

    CreateTicketMessageRequest:
      type: object
      required: [body]
