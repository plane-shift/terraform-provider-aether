    SubscriptionLine:
      type: object
      required: [kind, name, amount_eur, gross_amount_eur, discount_eur]
      properties:
        kind:
          type: string
          enum: [node_pool, control_plane, plan, plan_overage, public_ip, loadbalancer]
          description: >-
            Which flat monthly charge this line is. `plan` is a package fee and
            `plan_overage` the resources beyond its allowance (both
            cluster-scoped, with a null `node_pool_id`); `public_ip` is the
            mandatory public API endpoint every cluster is required to have —
            one line per cluster per month at the published `public_ip` rate
            (€4 at the time of writing), a flat month locked the first time the
            billing sampler observes the endpoint address, so replacing that
            address within the month does not add a line; `loadbalancer`, by
            contrast, is one line per public load-balancer address, so a
            cluster with several produces several.
        cluster_id:
          type: [string, 'null']
          format: uuid
        node_pool_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        amount_eur:
          type: number
          format: double
        # P1 discount columns (billing spec §9.1): amount_eur is the NET;
        # gross - discount = amount by construction.
        gross_amount_eur:
          type: number
          format: double
        discount_eur:
          type: number
          format: double

    AutoscalingRollupLine:
      type: object
      required: [pool_name, resource_type, unit, quantity, unit_price_eur, amount_eur]
      properties:
        node_pool_id:
          type: [string, 'null']
          format: uuid
        pool_name:
          type: string
        resource_type:
          type: string
          enum: [vcpu, memory, disk]
        unit:
          type: string
        quantity:
          type: number
          format: double
        unit_price_eur:
          type: number
          format: double
          description: Server-computed per-resource-hour rate from the rate card.
        amount_eur:
          type: number
          format: double
          description: Server-computed line cost (quantity × unit_price_eur).

    CostBreakdown:
      type: object
      required: [org_id, period_start, period_end, subscriptions, autoscaling, subtotal_eur]
      properties:
        org_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        subscriptions:
          type: array
          description: >-
            Flat monthly committed fees: fixed pools, control plane, packages and
            package overage, public API endpoints and load balancers (see
            SubscriptionLine.kind).
          items:
            $ref: '#/components/schemas/SubscriptionLine'
        autoscaling:
          type: array
          description: >-
            Server-priced autoscaling usage aggregated per node pool and
            resource type.
          items:
            $ref: '#/components/schemas/AutoscalingRollupLine'
        subtotal_eur:
          type: number
          format: double
          description: >-
            Reconciled month-to-date total (subscriptions + autoscaling).
            Reconciles to UsageSummary.total_eur to display precision — equal by
            linearity of the rate card, but float64 round-then-sum vs
            sum-then-multiply can differ by a few ULPs. Exact-cents parity lands
            with invoice generation in Phase 4.

    UsageSummary:
      type: object
      required: [org_id, period_start, period_end, items, total_eur, subscriptions]
      properties:
        org_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        items:
          type: array
          description: Autoscaling hourly usage records for the period.
          items:
            $ref: '#/components/schemas/UsageRecord'
        total_eur:
          type: number
          format: double
          description: Combined month-to-date total (subscriptions + autoscaling usage).
        subscriptions:
          type: array
          description: >-
            Flat monthly committed fees: fixed pools, control plane, packages and
            package overage, public API endpoints and load balancers (see
            SubscriptionLine.kind).
          items:
            $ref: '#/components/schemas/SubscriptionLine'

    DailySpendPoint:
      type: object
      required: [date, amount_eur]
      properties:
        date:
          type: string
          description: The day in YYYY-MM-DD (UTC).
        amount_eur:
          type: number
          format: double

    DailySpendResponse:
      type: object
      required: [points, total_eur, series]
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/DailySpendPoint'
        total_eur:
          type: number
          format: double
        series:
          type: string
          enum: [autoscaling]
          description: >-
            Names the source series. Daily-spend is autoscaling-only — flat
            monthly subscriptions are not a daily quantity and live in
            /billing/breakdown, whose subtotal is the authoritative bill. This
            label makes the scope explicit so the total isn't mistaken for the
            whole bill.

    Budget:
      type: object
      required: [org_id, monthly_limit_eur, thresholds_pct, created_at, updated_at]
      properties:
        org_id:
