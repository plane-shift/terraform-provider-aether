          $ref: '#/components/responses/NotFound'
    post:
      tags: [Clusters]
      operationId: createNodePool
      summary: Create a node pool
      description: >-
        Creates a node pool. Autoscaling is permitted; when `min_nodes`,
        `desired_nodes`, and `max_nodes` are equal the pool is fixed-size.
        Omitted bounds default to `desired_nodes` (which defaults to 1). Returns
        `202` while the pool provisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodePoolRequest'
      responses:
        '202':
          description: Node pool accepted for provisioning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePool'
        '400':
          description: >-
            Invalid request. Includes `no_schedulable_pool` when the new pool's
            taints would leave the cluster with no pool that can schedule
            workloads (a cluster must retain at least one pool with no
            `NoSchedule`/`NoExecute` taint).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/organizations/{orgID}/clusters/{clusterID}/nodepools/{poolID}:
    parameters:
