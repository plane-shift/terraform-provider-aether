        overage, public API endpoints and load balancers) plus server-priced
        autoscaling usage aggregated per node pool and resource type, with a
        reconciled subtotal in euros. The subtotal reconciles to
        UsageSummary.total_eur (to display precision; exact-cents parity lands
        with invoice generation in Phase 4) — this endpoint is the single source
