        body:
          type: string
        attachments:
          type: array
          items: {}
        attachment_ids:
          type: array
          description: >-
            IDs of `pending` attachments (previously reserved via the
            presign-upload endpoint) to confirm onto this message. Each id must
            be a pending upload owned by this ticket; any foreign/unknown id
            rejects the whole message (422) and rolls back the transaction.
          items:
            type: string
            format: uuid

    TicketMessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
